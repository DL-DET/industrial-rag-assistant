secondaryBackgroundColor = "#0C151E"
textColor = "#DDF2F5"
linkColor = "#72EDF5"
codeTextColor = "#C9F7FA"
codeBackgroundColor = "#09131B"
borderColor = "#1B3946"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "2px"
