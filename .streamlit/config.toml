[theme]
base = "light"
primaryColor = "#D9551C"
backgroundColor = "#F3EFE4"
secondaryBackgroundColor = "#FBF8F0"
textColor = "#12314F"
linkColor = "#B4470F"
codeTextColor = "#0A2237"
codeBackgroundColor = "#E9E2D1"
borderColor = "#12314F"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0px"
buttonRadius = "0px"
font = "Segoe UI"
headingFont = "Bahnschrift"
codeFont = "Cascadia Code"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["42px", "30px", "22px", "18px", "15px", "13px"]
headingFontWeights = [700, 700, 700, 700, 600, 600]
linkUnderline = false

greenColor = "#2F6B4F"
orangeColor = "#D9551C"
redColor = "#B03A2E"
blueColor = "#2C6E8F"
grayColor = "#77848C"

[theme.sidebar]
backgroundColor = "#E9E2D1"
secondaryBackgroundColor = "#F3EFE4"
codeBackgroundColor = "#EDE6D6"
textColor = "#12314F"
borderColor = "#12314F"
primaryColor = "#D9551C"

[server]
maxUploadSize = 10
